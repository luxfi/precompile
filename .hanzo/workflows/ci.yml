name: CI

# Build, vet and test the precompile suite on the native runners
# (git.hanzo.ai → git-runner).
#
# This replaces .github/workflows/ci.yml, whose jobs named
# `runs-on: lux-build-amd64`. No runner on this forge carries that label — the
# pools are `lux-build-linux-<arch>` — and a job naming a label nothing carries
# does not fail, it waits.
#
# The sibling checkouts also had to change. The old workflow pulled luxfi/mlx
# and PQClean/PQClean with `actions/checkout` + `repository:`, which resolves
# against GITHUB_SERVER_URL — here that is git.hanzo.ai, where PQClean/PQClean
# does not exist. They are cloned from github.com explicitly instead, so the
# source is stated rather than inferred from whichever forge is running the job.
#
# luxfi/accel v1.1.3+ auto-discovers the lux-gpu substrate (header +
# libluxgpu_hqc.a) by probing the standard install prefixes, so building and
# installing mlx to /usr/local is all that is needed — no CGO_CFLAGS,
# no CGO_LDFLAGS, no MLX_ROOT.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off

jobs:
  test:
    runs-on: [lux-build-linux-amd64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Clone the lux-gpu and PQClean sources
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/luxfi/mlx mlx-sibling
          # PQClean is upstream. We consume only hqc-{128,192,256}, which are
          # stable, so tracking master is fine for CI.
          git clone --depth 1 --branch master https://github.com/PQClean/PQClean pqclean-sibling

      - name: Build + install lux-gpu (CPU-only, no GPU device required)
        working-directory: mlx-sibling
        run: |
          set -euo pipefail
          # mlx's CMake silently disables luxgpu_hqc when the PQClean source is
          # unavailable and then `make luxgpu_hqc` fails with 'No rule to make
          # target luxgpu_hqc'. Point it at the sibling clone so the HQC kernel
          # target is created.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DLUX_GPU_BUILD_CUDA=OFF \
            -DLUX_GPU_BUILD_METAL=OFF \
            -DLUX_HQC_PQCLEAN_DIR="${GITHUB_WORKSPACE}/pqclean-sibling/crypto_kem"
          cmake --build build --target luxgpu_hqc luxgpu_core_static --parallel
          sudo cmake --install build
          pkg-config --modversion lux-gpu
          pkg-config --cflags --libs lux-gpu

      - run: make build
      - run: make test
      - run: make vet

  govulncheck:
    runs-on: [lux-build-linux-amd64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Advisory: reports findings without gating the merge. Kept as it was —
      # turning it blocking is a policy decision, not a migration.
      - run: govulncheck ./... || true
