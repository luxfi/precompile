[package]
name = "luxprecompile-sys"
version = "0.1.0"
edition = "2021"
description = "FFI bindings to libluxprecompile — all Lux EVM precompiles via Go shared library"
license-file = "LICENSE"
repository = "https://github.com/luxfi/precompile"
homepage = "https://lux.network"
readme = "README.md"
keywords = ["precompile", "evm", "ffi", "blockchain", "lux"]
categories = ["external-ffi-bindings", "cryptography"]
links = "luxprecompile"
authors = ["Lux Industries Inc."]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]

[features]
default = []

[package.metadata.docs.rs]
# docs.rs cannot link against libluxprecompile; build docs without the link step.
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]
